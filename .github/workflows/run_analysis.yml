
name: Run Annuity Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annuity-analysis:
    name: Validate and Generate Annuity Model
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download our repository onto GitHub's runner.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Prepare a Python environment.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Step 3: Install the required Python packages.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Check the model before generating outputs.
      - name: Run actuarial validation tests
        run: python -m unittest discover -s tests -v

      # Step 5: Calculate the baseline financial projection.
      - name: Run baseline annuity projection
        run: python -m src.run_model

      # Step 6: Generate the formula-driven Excel workbook.
      - name: Generate Excel workbook
        run: python -m src.generate_excel

      # Step 7: Run sensitivities and generate charts.
      - name: Run sensitivity analysis
        run: python -m analysis.sensitivity_analysis

      # Step 8: Publish downloadable project results.
      - name: Upload annuity analysis results
        uses: actions/upload-artifact@v7
        with:
          name: annuity-analysis-results
          path: output/
          if-no-files-found: error
          retention-days: 30
